aid: headout
name: HeadOut
description: >-
  Headout is a global experiences marketplace that curates and sells tickets to
  tours, attractions, events, shows and activities across major cities worldwide.
  For developers, Headout operates a public Partner API (github.com/headout/api-docs)
  that lets affiliates and resellers browse the catalog (products, categories,
  collections and subcategories by city and language), pull live inventory and
  per-person/per-group pricing for a variant, and place bookings through a two-step
  create-then-capture flow. The API is versioned by URI path (v1 and v2 under
  /api/public/), authenticates with a Headout-Auth API key (pk_ production / tk_
  sandbox), paginates with offset/limit, and returns a structured error envelope.
  A registrable seatmap iframe component is offered for seat selection. Headout is
  backed by 500 Global and Version One Ventures.
